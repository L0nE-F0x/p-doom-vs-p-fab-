[build]
  command = "npm run build"     # gate then tests — an unsourced claim fails the deploy
  publish = "web"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/fred/*"
  to = "https://api.stlouisfed.org/fred/:splat?api_key=FRED_API_KEY"
  status = 200
  force = true

[[redirects]]
  from = "/api/eia/*"
  to = "https://api.eia.gov/:splat?api_key=EIA_API_KEY"
  status = 200
  force = true
