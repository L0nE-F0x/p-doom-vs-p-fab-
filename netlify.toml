[build]
  command = "npm run build"
  publish = "web"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  included_files = ["config/anchors.json"]

[[redirects]]
  from = "/board"
  to = "/balance.html"
  status = 200

# The page is a static file. Don't let a CDN sit on a stale specimen for a week.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"
